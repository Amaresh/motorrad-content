<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyming Chain — Redirecting</title>
  <script>
    (function redirectCustomerPortalLinks() {
      var rules = [
        { prefix: '/track/', targetBase: 'https://motorradtheory.in' },
        { prefix: '/service-history/', targetBase: 'https://motorradtheory.in' },
        { prefix: '/photo-verification/', targetBase: 'https://motorradtheory.in' }
      ];

      var path = window.location.pathname || '/';
      var match = rules.find(function(rule) { return path.indexOf(rule.prefix) === 0; });
      if (!match) {
        return;
      }

      var destination = match.targetBase + path + window.location.search + window.location.hash;
      window.location.replace(destination);
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      padding: 28px;
      border-radius: 20px;
      background: #111827;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.6;
      color: #94a3b8;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Page not found</h1>
    <p>
      If you opened a customer service link, you are being redirected to the live portal.
      If nothing happens, return to the Tyming Chain homepage.
    </p>
    <a href="/">Go to tymingchain.com</a>
  </div>
</body>
</html>
